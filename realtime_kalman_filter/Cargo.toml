[package]
name = "realtime_kalman_filter"
version = "0.1.0"
edition = "2024"
authors = ["Yuuki Takano", "TIER IV, Inc."]
description = "Pure-Rust, ROS-free, no_std-capable Kalman filter ported from Autoware's autoware_kalman_filter (KalmanFilter + TimeDelayKalmanFilter on dynamically-sized matrices)."
license = "MIT OR Apache-2.0"
documentation = "https://tier4.github.io/realtime_core/"

[dependencies]
# Dynamically-sized matrices (the C++ package is Eigen::MatrixXd throughout) need `alloc`;
# `libm` supplies sqrt for the no_std Cholesky path.
nalgebra = { version = "0.33", default-features = false, features = ["libm", "alloc"] }

[lints]
workspace = true
